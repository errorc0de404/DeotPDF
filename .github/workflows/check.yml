# Checks the text engine work of roadmap P2 (1.2) on every push to main or a dev-* branch, and on demand. Nothing is uploaded.
# - Windows: the full test suite with the WPF engine and again with the Skia engine (PDFNOTES_TEXT_ENGINE=skia).
# - Windows, Ubuntu, macOS: the CLI and PDF tests against the WPF-free CLI build (-p:DeotEngine=Skia).
name: Check

on:
  push:
    branches: [main, "dev-*", p4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tests (WPF text engine)
        run: dotnet test tests/PdfNotes.Tests -c Release

      - name: Tests (Skia text engine)
        env:
          PDFNOTES_TEXT_ENGINE: skia
        run: dotnet test tests/PdfNotes.Tests -c Release --no-build

  skia-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Noto Sans CJK KR is the Linux fallback family of the Skia engine; NanumGothic (TrueType) is the font the tests'
      # sample PDFs are written with outside Windows (ProbeSamplePdf).
      - name: Korean fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-nanum fontconfig

      - name: Korean fonts (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask font-nanum-gothic
          font=$(find ~/Library/Fonts /Library/Fonts -iname 'NanumGothic*.ttf' ! -iname '*Bold*' ! -iname '*Light*' 2>/dev/null | sort | head -1)
          echo "sample font: $font"
          echo "PDFNOTES_SAMPLE_FONT=$font" >> "$GITHUB_ENV"

      - name: CLI and PDF tests (Skia build)
        run: dotnet test tests/PdfNotes.Cli.Tests -c Release -p:DeotEngine=Skia -p:RuntimeIdentifier=${{ matrix.rid }}

  desktop:
    # Roadmap P4: the Avalonia app (PdfNotes.Desktop) under Avalonia.Headless on all three systems.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Korean fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-nanum fontconfig

      - name: Korean fonts (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask font-nanum-gothic
          font=$(find ~/Library/Fonts /Library/Fonts -iname 'NanumGothic*.ttf' ! -iname '*Bold*' ! -iname '*Light*' 2>/dev/null | sort | head -1)
          echo "PDFNOTES_SAMPLE_FONT=$font" >> "$GITHUB_ENV"

      - name: Desktop app tests (headless)
        run: dotnet test tests/PdfNotes.Desktop.Tests -c Release -p:RuntimeIdentifier=${{ matrix.rid }}
