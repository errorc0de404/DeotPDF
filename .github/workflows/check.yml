# Checks every push to main, a p4* or p5* work branch or a dev-* branch, and on demand. Nothing is uploaded.
# - Windows: the shared test suite (model, PDF, text engine, editor, view models, CLI).
# - Windows, Ubuntu, macOS: the CLI and PDF tests with each system's fonts, and the app under Avalonia.Headless with a
#   smoke test of its release package.
name: Check

on:
  push:
    branches: [main, "dev-*", "p4*", "p5*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tests
        run: dotnet test tests/PdfNotes.Tests -c Release

  skia-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Noto Sans CJK KR is the Linux fallback family of the Skia engine; NanumGothic (TrueType) is the font the tests'
      # sample PDFs are written with outside Windows (ProbeSamplePdf).
      - name: Korean fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-nanum fontconfig

      - name: Korean fonts (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask font-nanum-gothic
          font=$(find ~/Library/Fonts /Library/Fonts -iname 'NanumGothic*.ttf' ! -iname '*Bold*' ! -iname '*Light*' 2>/dev/null | sort | head -1)
          echo "sample font: $font"
          echo "PDFNOTES_SAMPLE_FONT=$font" >> "$GITHUB_ENV"

      - name: CLI and PDF tests
        run: dotnet test tests/PdfNotes.Cli.Tests -c Release -p:RuntimeIdentifier=${{ matrix.rid }}

  desktop:
    # Roadmap P4: the Avalonia app (PdfNotes.Desktop) under Avalonia.Headless on all three systems.
    timeout-minutes: 20 # a hung headless test should fail, not hold the run for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Korean fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-nanum fontconfig

      - name: Korean fonts (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask font-nanum-gothic
          font=$(find ~/Library/Fonts /Library/Fonts -iname 'NanumGothic*.ttf' ! -iname '*Bold*' ! -iname '*Light*' 2>/dev/null | sort | head -1)
          echo "PDFNOTES_SAMPLE_FONT=$font" >> "$GITHUB_ENV"

      - name: Desktop app tests (headless)
        run: dotnet test tests/PdfNotes.Desktop.Tests -c Release -p:RuntimeIdentifier=${{ matrix.rid }}

      # Roadmap P4 A7: the release package of this system builds, and its CLI starts (self-contained, Skia build).
      - name: Package (smoke test)
        shell: pwsh
        run: |
          ./tools/package-release.ps1 -Rid ${{ matrix.rid }} -OutDir artifacts/check
          $folder = Get-ChildItem artifacts/check -Directory | Sort-Object Name | Select-Object -Last 1 # the portable one on Windows
          $deot = switch ("${{ runner.os }}") {
            "Windows" { Join-Path $folder.FullName "deot.exe" }
            "macOS" { Join-Path $folder.FullName "DeotPDF.app/Contents/MacOS/deot" }
            default { Join-Path $folder.FullName "deot" }
          }
          $out = & $deot schema
          if ($LASTEXITCODE -ne 0 -or ($out | ConvertFrom-Json).ok -ne $true) { throw "deot schema failed: $out" }

  # Roadmap P5: the Android app builds (an APK for arm64 devices and the x64 emulator). It is tried on a device by hand.
  android:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Android workload
        run: dotnet workload install android

      - name: Build
        run: dotnet build src/PdfNotes.Android -c Release
